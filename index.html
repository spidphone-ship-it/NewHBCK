class WA{
 constructor(urls,o={}){this.urls=urls;this.loop=!!o.loop;this._vol=o.vol==null?1:o.vol;this.buf=null;this.src=null;this.g=null;this.off=0;this.t0=0;this.playing=false;this.ended=false;this.onended=null;this._want=false;WAS.add(this);if(!o.lazy)this.load()}
